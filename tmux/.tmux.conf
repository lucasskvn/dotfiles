set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 10000

set -g mouse on
set -g escape-time 10

set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r P choose-tree -Zs

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Gruvbox dark
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left "#[bg=#b8bb26,fg=#282828] #S #[bg=#3c3836,fg=#ebdbb2]"
set -g status-right "#[bg=#3c3836,fg=#ebdbb2] %d/%m %H:%M "
set -g status-left-length 30
set -g status-right-length 60

set -g window-status-format " #I:#W "
set -g window-status-current-style "bg=#83a598,fg=#282828"
set -g window-status-current-format " #I:#W "

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"

set -g message-style "bg=#3c3836,fg=#fabd2f"
set -g message-command-style "bg=#3c3836,fg=#fabd2f"

set -g display-panes-colour "#83a598"
set -g display-panes-active-colour "#fb4934"

set -g clock-mode-colour "#b8bb26"
set -g clock-mode-style 24
